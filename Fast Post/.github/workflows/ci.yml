name: FastPost CI

on:
  pull_request:
    paths:
      - "Fast Post/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "Fast Post/**"
      - ".github/workflows/ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Fast Post"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Fast Post/package-lock.json"

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test
      - run: npm run build
